[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aaqa"
version = "1.3.0"
description = "Air quality analysis and forecasting (six pollutants) and weather for Abidjan"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "gikodaku" }]
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "requests>=2.28",
    "pyyaml>=6.0",
    "matplotlib>=3.9",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "pydantic>=2.5"]
dashboard = ["streamlit>=1.50", "plotly>=5.18"]
assistant = ["anthropic>=2.0"]
notebooks = ["jupyter>=1.0", "ipykernel>=6.15", "nbclient>=0.10", "nbformat>=5.9"]
dev = [
    "aaqa[api,dashboard,assistant,notebooks]",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.5",
]

[project.scripts]
aaqa = "aaqa.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
