        <stop offset="0.82" stop-color="#fff"/><stop offset="1" stop-color="#000"/>
      </linearGradient>
      <mask id="kos-mask-good" maskUnits="userSpaceOnUse" x="0" y="0" width="160"
            height="170"><rect width="160" height="170" fill="url(#kos-fade-good)"/></mask>
      </defs>
